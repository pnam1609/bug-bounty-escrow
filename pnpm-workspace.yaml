packages:
  - 'apps/*'
  - 'packages/*'
minimumReleaseAge: 1440
overrides:
  postcss: '8.5.17'
  # cuer@0.0.3 renders RainbowKit QR codes with border: 0; qr@0.6 rejects that valid call.
  qr: '0.5.5'
allowBuilds:
  '@scarf/scarf': false
  bufferutil: false
  esbuild: true
  keccak: true
  sharp: false
  utf-8-validate: false
