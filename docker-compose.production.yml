name: bounty-escrow

services:
  api:
    image: '${API_IMAGE:?Set API_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}'
    restart: unless-stopped
    init: true
    env_file:
      - '${ENV_FILE:-.env.production}'
    environment:
      NODE_ENV: production
      PORT: '3001'
    ports:
      - '127.0.0.1:${API_BIND_PORT:-7831}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - supabase

  web:
    image: '${WEB_IMAGE:?Set WEB_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}'
    restart: unless-stopped
    init: true
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PORT: '3000'
    ports:
      - '127.0.0.1:${WEB_BIND_PORT:-7830}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: '${MIGRATIONS_IMAGE:?Set MIGRATIONS_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}'
    profiles:
      - tools
    env_file:
      - '${ENV_FILE:-.env.production}'
    environment:
      NODE_ENV: production
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - supabase

networks:
  supabase:
    external: true
    name: supabase_default
