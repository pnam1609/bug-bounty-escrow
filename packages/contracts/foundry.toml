[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
evm_version = "cancun"
via_ir = false
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
